name: kudosuco
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: kudos
      POSTGRES_USER: kudos
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Configura DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55433}:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kudos -d kudos"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/kudos
      DATABASE_USER: kudos
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Configura DATABASE_PASSWORD}
      KUDOS_DEMO: ${KUDOS_DEMO:-1}
      KUDOS_EMAIL_DOMAIN: ${KUDOS_EMAIL_DOMAIN:-uco.edu.co}
      KUDOS_ORIGIN: ${KUDOS_ORIGIN:-}
      KUDOS_VERIFICATION_KEY: ${KUDOS_VERIFICATION_KEY:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8084}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          origen="$${KUDOS_ORIGIN#https://}"
          origen="$${origen:-127.0.0.1:8080}"
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /api/health HTTP/1.1\r\nHost: %s\r\nConnection: close\r\n\r\n' "$$origen" >&3
          IFS= read -r respuesta <&3
          [[ "$$respuesta" == "HTTP/1.1 200 "* ]]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5177}:5173"
volumes:
  postgres-datos:
