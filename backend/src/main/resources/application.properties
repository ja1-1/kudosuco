spring.application.name=uco-kudos
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8084}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55433/kudos}
spring.datasource.username=${DATABASE_USER:kudos}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
kudos.demo=${KUDOS_DEMO:0}
kudos.origin=${KUDOS_ORIGIN:}
kudos.institution=${KUDOS_EMAIL_DOMAIN:uco.edu.co}
kudos.verification-key=${KUDOS_VERIFICATION_KEY:}
spring.mail.host=${KUDOS_SMTP_HOST:127.0.0.1}
spring.mail.port=${KUDOS_SMTP_PORT:587}
spring.mail.username=${KUDOS_SMTP_USER:}
spring.mail.password=${KUDOS_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
